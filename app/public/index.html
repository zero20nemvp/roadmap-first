<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roadmap-First Coach</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Kalam:wght@400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: the conversation on the left, the wall of post-its it builds on the right; the steps across the top */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#141C26; --muted:#56636F; --line:#D2D9E0;
  --accent:#1F4FE0; --flag:#D93A3F; --ok:#1E8A4C;
  --yellow:#FFE45C; --blue:#9AD6FF; --pink:#FF9DBB; --note-ink:#1D1B16;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
  --f-hand:"Kalam", "Comic Sans MS", "Marker Felt", cursive;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --shadow:0 1px 1px rgba(20,28,38,.08), 0 6px 14px -6px rgba(20,28,38,.28);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1319; --surface:#161D26; --ink:#E7ECF1; --muted:#97A4B1; --line:#2A3542;
  --accent:#7D9CFF; --flag:#FF6E72; --ok:#5BD08B;
  --shadow:0 1px 1px rgba(0,0,0,.4), 0 8px 18px -6px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1319; --surface:#161D26; --ink:#E7ECF1; --muted:#97A4B1; --line:#2A3542;
  --accent:#7D9CFF; --flag:#FF6E72; --ok:#5BD08B;
  --shadow:0 1px 1px rgba(0,0,0,.4), 0 8px 18px -6px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);display:grid;grid-template-rows:auto 1fr}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font:600 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--accent)}
ol.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
ol.steps li{font:600 12px/1 var(--f-mono);padding:7px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
ol.steps li.done{color:var(--ok);border-color:var(--ok)}
ol.steps li.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);min-height:0}
.chat{display:grid;grid-template-rows:1fr auto;min-height:0;border-right:1px solid var(--line)}
.log{overflow-y:auto;padding:24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.msg{max-width:62ch;padding:12px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.coach{background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.msg.founder{background:var(--accent);color:#fff;align-self:flex-end}
.msg.err{border-color:var(--flag);color:var(--flag)}
.msg.thinking{color:var(--muted)}
.msg.thinking::after{content:"…";animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
form.say{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
textarea{flex:1;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:none;min-height:46px;max-height:180px}
button{font:600 15px/1 var(--f-body);background:var(--accent);color:#fff;border:0;border-radius:10px;padding:0 18px;cursor:pointer;min-height:46px}
button:disabled{opacity:.5;cursor:default}
textarea:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.contact{display:none;gap:10px;padding:16px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.contact.on{display:grid}
.contact .row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}
.contact input[type=text],.contact input[type=email]{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.contact label{display:flex;gap:8px;align-items:flex-start;color:var(--muted)}
.contact .err{color:var(--flag)}
aside{overflow-y:auto;padding:24px max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px;align-content:start}
aside h2{font:700 20px/1.1 var(--f-display);letter-spacing:-.02em;margin:0}
aside .hint{color:var(--muted);font-size:14px;margin:4px 0 0}
.lane{display:grid;gap:8px}
.lane h3{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.note{background:var(--c,var(--yellow));color:var(--note-ink);font:400 16px/1.3 var(--f-hand);padding:10px 12px 14px;box-shadow:var(--shadow);border-radius:2px 2px 6px 2px;overflow-wrap:anywhere;animation:pop .25s ease-out}
.note .tag{font:600 10px/1 var(--f-mono);letter-spacing:.06em;opacity:.7;display:block;margin-bottom:5px}
.note.p{--c:var(--pink)} .note.y{--c:var(--yellow)} .note.b{--c:var(--blue)} .note.u{--c:var(--surface);color:var(--ink);border:1px dashed var(--line)}
.pays{display:inline-block;margin-top:6px;font:600 11px/1 var(--f-mono);background:var(--note-ink);color:var(--yellow);padding:4px 6px;border-radius:4px}
.empty{color:var(--muted);font-size:14px}
@keyframes pop{from{transform:scale(.9);opacity:0}}
@media (prefers-reduced-motion:reduce){.note{animation:none}.msg.thinking::after{animation:none}}
.wall-toggle{display:none}
@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr)}
  .chat{border-right:0}
  aside{display:none;border-top:1px solid var(--line)}
  body.wall aside{display:grid}
  body.wall .chat{display:none}
  .wall-toggle{display:inline-block;margin-left:auto;background:transparent;color:var(--ink);border:1px solid var(--line);min-height:36px;padding:0 12px;font-size:13px}
  .contact .row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <span class="brand"><b>021</b> · roadmap-first coach</span>
  <ol class="steps" id="steps"></ol>
  <button class="wall-toggle" id="toggle" type="button">Show the wall</button>
</header>
<main>
  <section class="chat">
    <div class="log" id="log" aria-live="polite"></div>
    <div>
      <form class="say" id="say">
        <textarea id="text" rows="1" placeholder="Type your answer…" aria-label="Your answer" maxlength="2000"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <form class="contact" id="contact" novalidate>
        <strong>Where should we send your report?</strong>
        <div class="row">
          <input type="text" name="name" placeholder="Your name" autocomplete="name" aria-label="Your name">
          <input type="email" name="email" placeholder="Email" autocomplete="email" aria-label="Email">
          <button type="submit">Send me my report</button>
        </div>
        <label><input type="checkbox" name="consent"> Send me my report and follow-up emails.</label>
        <span class="err" id="contact-err" role="alert"></span>
      </form>
    </div>
  </section>
  <aside id="wall" aria-label="Your wall"></aside>
</main>
<script>
const $ = id => document.getElementById(id)
const log = $('log'), text = $('text'), send = $('send')
let state = null

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

function bubble(role, words) {
  const el = document.createElement('div')
  el.className = `msg ${role}`
  el.textContent = words
  log.append(el)
  log.scrollTop = log.scrollHeight
  return el
}

function render(v) {
  state = v
  $('steps').innerHTML = v.steps.map((n, i) => `<li class="${i < v.step ? 'done' : i === v.step ? 'on' : ''}">${i === 0 ? '' : i + ' · '}${esc(n)}</li>`).join('')
  const w = v.wall
  const lane = (title, items, cls, body) => `<div class="lane"><h3>${title}</h3>${items.length ? `<div class="notes">${items.map(x => `<div class="note ${cls}"><span class="tag">${esc(x.id)}${x.problem ? ' · ' + esc(x.problem) : ''}${x.job ? ' · ' + esc(x.job) : ''}</span>${body(x)}</div>`).join('')}</div>` : '<p class="empty">Nothing yet.</p>'}</div>`
  $('wall').innerHTML = `<div><h2>${esc(w.product?.name || 'Your wall')}</h2><p class="hint">${w.product?.who ? 'For ' + esc(w.product.who) + '. ' : ''}What you say lands here as post-its.</p></div>
    ${lane('1 · Problems', w.problems, 'p', x => esc(x.text))}
    ${lane('2 · Workarounds', w.workarounds, 'y', x => esc(x.text) + (x.pays ? `<br><span class="pays">pays ${esc(x.pays)}</span>` : ''))}
    ${lane('3 · Jobs', w.jobs, 'y', x => `When ${esc(x.when)}, I want ${esc(x.want)}, so ${esc(x.so)}`)}
    ${lane('4 · Features', w.features, 'b', x => esc(x.name))}
    ${w.unknowns.length ? lane('Parked to test', w.unknowns, 'u', x => esc(x.text)) : ''}`
  $('say').hidden = v.done
  $('contact').classList.toggle('on', v.done && !v.contacted)
  if (v.contacted) $('say').hidden = true
}

async function start() {
  let id = null
  try { id = localStorage.getItem('coach-session') } catch {}
  const r = await fetch('/api/session', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id }) })
  const v = await r.json()
  if (!r.ok) { bubble('coach err', v.error); return }
  try { localStorage.setItem('coach-session', v.id) } catch {}
  for (const m of v.chat) bubble(m.role, m.text)
  if (v.contacted) bubble('coach', 'Thanks: your report is on its way to your inbox.')
  render(v)
  text.focus()
}

async function say(words) {
  bubble('founder', words)
  const out = bubble('coach thinking', '')
  send.disabled = true
  let got = ''
  try {
    const r = await fetch('/api/turn', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: state.id, text: words }) })
    if (!r.ok) {
      const e = await r.json().catch(() => ({ error: 'Something went wrong. Try again.' }))
      out.className = 'msg coach err'; out.textContent = e.error
      return
    }
    const reader = r.body.getReader(), dec = new TextDecoder()
    let buf = ''
    for (;;) {
      const { value, done } = await reader.read()
      if (done) break
      buf += dec.decode(value, { stream: true })
      let nl
      while ((nl = buf.indexOf('\n')) >= 0) {
        const e = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1)
        if (e.type === 'text') { got += e.delta; out.className = 'msg coach'; out.textContent = got.trim(); log.scrollTop = log.scrollHeight }
        else if (e.type === 'wall' || e.type === 'end') render(e)
        else if (e.type === 'error') { out.className = 'msg coach err'; out.textContent = e.error; text.value = words }
      }
    }
  } catch {
    out.className = 'msg coach err'; out.textContent = 'Lost the connection. Send that again.'; text.value = words
  } finally {
    send.disabled = false
    text.focus()
  }
}

$('say').addEventListener('submit', e => {
  e.preventDefault()
  const words = text.value.trim()
  if (!words || send.disabled) return
  text.value = ''; text.style.height = ''
  say(words)
})
text.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('say').requestSubmit() }
})
text.addEventListener('input', () => { text.style.height = ''; text.style.height = Math.min(text.scrollHeight, 180) + 'px' })
$('toggle').addEventListener('click', () => {
  const on = document.body.classList.toggle('wall')
  $('toggle').textContent = on ? 'Back to the chat' : 'Show the wall'
})
$('contact').addEventListener('submit', async e => {
  e.preventDefault()
  const f = new FormData(e.target)
  const r = await fetch('/api/contact', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ id: state.id, name: f.get('name'), email: f.get('email'), consent: f.get('consent') === 'on' }) })
  const v = await r.json()
  if (!r.ok) { $('contact-err').textContent = v.error; return }
  render(v)
  bubble('coach', `Thanks, ${v.wall.product?.name ? 'your ' + v.wall.product.name + ' report' : 'your report'} is on its way to your inbox, with your flight plan from Ground Zero.`)
})

start()
</script>
</body>
</html>
