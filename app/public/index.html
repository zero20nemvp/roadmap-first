<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0A151E">
<link rel="icon" href="data:,">
<title>Roadmap-first coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
html,body{height:100%;margin:0;overflow:hidden;background:#0A151E}
/* The roadmap as one long page, rising over the kiosk; back and Escape return to the flow */
.roadmap{position:fixed;inset:0;z-index:50;background:#0E1116;opacity:0;transform:translateY(28px) scale(.985);transition:opacity .45s cubic-bezier(.25,1,.35,1),transform .55s cubic-bezier(.25,1,.35,1)}
.roadmap.open{opacity:1;transform:none}
.roadmap iframe{border:0;width:100%;height:100%;display:block}
.roadmap nav{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}
.roadmap nav>*{pointer-events:auto;font:400 12px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.04em;color:#CFE3EE;background:rgba(10,21,30,.82);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:10px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;text-decoration:none}
.roadmap nav>*:hover{border-color:rgba(120,210,255,.5)}
@media (max-width:520px){.roadmap nav a{display:none}}
</style>
</head>
<body>
<script type="module">
// The coach on the kiosk kit (kiosk.js, from ~/Code/kiosk-pattern): this file is only what the coach says and means.
import { mount } from '/kiosk.js'

let state = null   // the server's view: id, step, steps, wall, chat, done, contacted, trashed
let contact = null // the end: { stage: 'name' | 'email' | 'code' | 'consent', name, email }
let me = null      // the account this browser is logged in as: { email, name }
let login = null   // /login: { stage: 'email' | 'code', email }

/** This browser's id: the server counts new conversations per browser, not per venue wifi. */
const browser = (() => {
  try {
    let b = localStorage.getItem('coach-browser')
    if (!b) localStorage.setItem('coach-browser', b = crypto.randomUUID())
    return b
  } catch { return crypto.randomUUID() }
})()

async function post(path, data) {
  const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) })
  const v = await r.json().catch(() => ({ error: 'Something went wrong. Try again.' }))
  if (!r.ok) throw Object.assign(new Error(v.error), { code: v.code })
  return v
}

/** Ground Zero as argued so far: its job, and its features kept, moved later or still open. */
function argued() {
  const w = liveWall(state.wall), gz = state.wall.groundZero ?? { argued: {} }
  const job = w.jobs.find(j => j.id === gz.job), features = job ? w.features.filter(f => f.job === job.id) : []
  const is = keep => features.filter(f => gz.argued[f.id]?.keep === keep)
  return { job, month: gz.month, features, kept: is(true), later: is(false), open: features.filter(f => !gz.argued[f.id]), reasons: gz.argued }
}

/** The wall without what is in the trash. */
const liveWall = w => Object.fromEntries(Object.entries(w).map(([k, v]) => [k, Array.isArray(v) ? v.filter(x => !x.trashed) : v]))
const counts = wall => { const w = liveWall(wall); return [[w.problems, 'problem'], [w.workarounds, 'workaround'], [w.jobs, 'job'], [w.features, 'feature'], [w.unknowns, 'parked']]
  .filter(([a]) => a.length).map(([a, n]) => `${a.length} ${n === 'parked' ? n : n + (a.length > 1 ? 's' : '')}`).join(' · ') }
const hasWall = () => !!(state && (state.wall.product?.name || counts(state.wall)))

function status() {
  if (!state) return ''
  if (state.contacted && state.done) return state.plan ? 'enter to walk your roadmap · /roadmap for the report · /new to start again' : 'enter to see your roadmap · /new to start again'
  if (state.done) return 'the four steps are done · your report is next'
  const c = counts(state.wall)
  const gz = argued()
  const where = state.step === 0 ? 'getting started' : `step ${state.step} of 5 · ${state.steps[state.step].toLowerCase()}`
  if (state.step === 5) return [where, gz.job ? `${gz.job.id} · ${gz.kept.length} kept · ${gz.later.length} later${gz.open.length ? ` · ${gz.open.length} to argue` : ''}` : 'which job first?', '/wall'].join(' · ')
  return [where, c, hasWall() ? '/wall' : ''].filter(Boolean).join(' · ')
}

/** One founder turn: the reply streams in as NDJSON while the balls bounce. */
async function ask(text, out) {
  const r = await fetch('/api/turn', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: state.id, text }) })
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw Object.assign(new Error(e.error || 'Something went wrong. Try again.'), { code: e.code }) }
  const reader = r.body.getReader(), dec = new TextDecoder()
  let buf = ''
  for (;;) {
    const { value, done } = await reader.read()
    if (done) break
    buf += dec.decode(value, { stream: true })
    let nl
    while ((nl = buf.indexOf('\n')) >= 0) {
      const e = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1)
      if (e.type === 'text') out.write(e.delta)
      else if (e.type === 'wall' || e.type === 'end') state = e
      else if (e.type === 'error') throw new Error(e.error)
    }
  }
}

function exchanges() {
  const c = state?.chat || [], out = []
  c.forEach((m, i) => { if (m.role === 'coach') out.push({ echo: c[i - 1]?.role === 'founder' ? c[i - 1].text : '', text: m.text }) })
  return out
}

/* ---------- the wall ---------- */
function openWall(k, at = 0) {
  if (!hasWall()) return k.note('said', 'Nothing on your wall yet: it fills as you answer.')
  const w = liveWall(state.wall), items = []
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : ''
  if (w.product?.name) items.push({ title: w.product.name, stamp: 'product', text: [w.product.who && `For ${w.product.who}.`, cap(w.product.pitch)].filter(Boolean).join(' '), dot: 'var(--dim)' })
  for (const x of w.problems) items.push({ id: x.id, title: `${x.id} · problem`, stamp: 'step 1', text: x.text, dot: 'var(--bad)' })
  for (const x of w.workarounds) items.push({ id: x.id, title: `${x.id} · workaround for ${x.problem}`, stamp: 'step 2', text: x.text + (x.pays ? ` · pays ${x.pays}` : ''), dot: 'var(--warn)' })
  for (const x of w.jobs) items.push({ id: x.id, title: `${x.id} · job${x.from ? ' from ' + x.from : ''}`, stamp: 'step 3', text: `When ${x.when}, I want ${x.want}, so ${x.so}.`, dot: 'var(--mine)' })
  for (const x of w.features) items.push({ id: x.id, title: `${x.id} · feature for ${x.job}`, stamp: 'step 4', text: x.name, dot: 'var(--live)' })
  for (const x of w.unknowns) items.push({ id: x.id, title: `${x.id} · parked to test`, text: x.text, dot: 'var(--faint)' })
  const gz = argued()
  if (gz.job) items.push({ title: `Ground Zero · ${gz.job.id}`, stamp: gz.month ? `step 5 · ${monthName(gz.month)}` : 'step 5', dot: 'var(--mine)', text: [
    gz.kept.length ? `Keeps ${gz.kept.map(f => f.name).join(', ')}.` : '',
    gz.later.length ? `Later: ${gz.later.map(f => f.name).join(', ')}.` : '',
    gz.open.length ? `Still to argue: ${gz.open.map(f => f.name).join(', ')}.` : '',
  ].filter(Boolean).join(' ') })
  const toTrash = (x, k, i) => x.id ? trashItem(k, x.id, i) : k.note('err', 'Your product stays: it’s what the wall is about.')
  k.list(items, { title: 'your wall', at, actions: { t: toTrash, Backspace: toTrash, Delete: toTrash }, keys: 't to trash' })
}

/* ---------- the trash: nothing is deleted, everything comes back ---------- */
const item = (w, id) => [...w.problems, ...w.workarounds, ...w.jobs, ...w.features, ...w.unknowns].find(x => x.id === id)
const words = x => x.name ?? (x.when ? `When ${x.when}, I want ${x.want}, so ${x.so}.` : x.text)

async function trashItem(k, id, at) {
  try { state = await post('/api/wall', { id: state.id, item: id, trashed: true }) } catch (e) { return k.note('err', e.message) }
  const gone = [id, ...[...state.wall.workarounds, ...state.wall.features].filter(x => (x.problem === id || x.job === id) && x.trashed === item(state.wall, id).trashed).map(x => x.id)]
  if (hasWall()) await openWall(k, at); else k.back()
  k.note('said', `${gone.join(' and ')} moved to the trash · /trash brings ${gone.length > 1 ? 'them' : 'it'} back`)
}

let gotConversations = []
async function openTrash(k, at = 0) {
  const w = state.wall, items = []
  const binned = [...w.problems, ...w.workarounds, ...w.jobs, ...w.features, ...w.unknowns].filter(x => x.trashed)
    .sort((a, b) => b.trashed.localeCompare(a.trashed))
  for (const x of binned) items.push({ kind: 'item', id: x.id, title: `${x.id} · from your wall`, stamp: when(x.trashed), text: words(x), dot: 'var(--faint)' })
  if (me) {
    try { gotConversations = (await (await fetch('/api/conversations')).json()).conversations ?? [] } catch {}
    for (const c of gotConversations.filter(c => c.trashed)) items.push({ kind: 'conversation', id: c.id, title: c.product || 'a conversation not named yet', stamp: when(c.trashed), text: `conversation · ${c.done ? 'finished' : c.stepName.toLowerCase()} · started ${when(c.created)}`, dot: 'var(--dim)' })
  }
  if (!items.length) { k.back(); return k.note('said', 'Your trash is empty.') }
  const restore = async (x, k, i) => {
    try {
      if (x.kind === 'item') state = await post('/api/wall', { id: state.id, item: x.id, trashed: false })
      else await post('/api/conversation', { id: x.id, trashed: false })
    } catch (e) { return k.note('err', e.message) }
    await openTrash(k, i)
    k.note('said', x.kind === 'item' ? `${x.id} is back on your wall` : `${x.title} is back in /conversations`)
  }
  k.list(items, { title: 'your trash', at, open: restore, actions: { t: restore }, keys: 'enter or t to bring back' })
}
const when = iso => new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
const hasTrash = () => !!state && [...state.wall.problems, ...state.wall.workarounds, ...state.wall.jobs, ...state.wall.features, ...state.wall.unknowns].some(x => x.trashed)

/* ---------- your conversations, under your account ---------- */
async function openConversations(k, at = 0) {
  let list
  try { const r = await fetch('/api/conversations'); list = await r.json(); if (!r.ok) throw new Error(list.error) } catch (e) { return k.note('err', e.message) }
  const items = list.conversations.filter(c => !c.trashed).map(c => ({
    id: c.id, title: (c.product || 'not named yet') + (c.id === state?.id ? ' · open now' : ''), stamp: when(c.updated),
    text: c.done ? 'finished · your roadmap is ready' : c.step === 0 ? 'just started' : `step ${c.step} of 5 · ${c.stepName.toLowerCase()}`,
    dot: c.id === state?.id ? 'var(--mine)' : c.done ? 'var(--live)' : 'var(--dim)',
  }))
  if (!items.length) return k.note('said', 'No conversations yet: say what you’re building.')
  const open = async x => {
    if (x.id === state.id) return k.back()
    try { state = await post('/api/session', { id: x.id, browser }) } catch (e) { return k.note('err', e.message) }
    remember(); contact = null
    await resumeHere(k)
  }
  const bin = async (x, k, i) => {
    try { await post('/api/conversation', { id: x.id, trashed: true }) } catch (e) { return k.note('err', e.message) }
    if (x.id === state.id) { await startNew(k); return k.note('said', 'Moved to your trash, and a fresh conversation is ready · /trash brings it back') }
    await openConversations(k, i)
    k.note('said', `${x.title} moved to the trash · /trash brings it back`)
  }
  k.list(items, { title: `your conversations · ${me.email}`, at, open, actions: { t: bin, Backspace: bin, Delete: bin }, keys: 'enter to open · t to trash' })
}

/* ---------- /login and /logout ---------- */
function remember() { try { localStorage.setItem('coach-session', state.id) } catch {} }

async function startLogin(k) {
  login = { stage: 'email' }
  await k.say('Which email are you? We’ll send a code to it.', { status: 'log in · 1 of 2 · esc to cancel' })
}

async function loginStep(k, text) {
  if (login.stage === 'email') {
    try { await post('/api/login/start', { email: text }) } catch (e) { return k.note('err', e.message) }
    login = { stage: 'code', email: text }; k.clear()
    await k.say(`We’ve sent a code to ${text}. Type it here.`, { echo: text, status: 'log in · 2 of 2 · esc to change the email' })
    return k.note()
  }
  try { me = (await post('/api/login/verify', { email: login.email, code: text, id: state?.id })).me } catch (e) { return k.note('err', e.message) }
  login = null; k.clear()
  // this conversation is now theirs; on with it
  try { state = await post('/api/session', { id: state?.id, browser }); remember() } catch {}
  await resumeHere(k)
  k.note('said', `Logged in as ${me.email} · /conversations has all of yours`)
}

async function logout(k) {
  try { await post('/api/logout', {}) } catch {}
  me = null; login = null; contact = null
  try { localStorage.removeItem('coach-session') } catch {}
  await startNew(k)
  k.note('said', 'Logged out. Your conversations are safe in your account: /login to see them again.')
}

/** Show the open conversation where it stands. */
async function resumeHere(k) {
  if (state.contacted && state.done) await k.resume('', `Thank you. Your report is with your facilitator${state.consent ? ', and on its way to you' : ''}.\n\nPress enter to walk through your roadmap${state.plan ? ' and flight plan' : ''} again.`)
  else if (state.chat.length > 1) { const last = exchanges().at(-1); await k.resume(last.echo, last.text) }
  else await k.reset()
  if (state.done && !state.contacted) beginContact()
}

/* ---------- the roadmap, played back at the end ---------- */
const monthName = m => new Date(m + '-01T00:00:00Z').toLocaleDateString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' })
const releaseName = r => r.id === 'GZ' ? 'Ground Zero' : `Release ${r.id.slice(1)}`
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : ''

function showRoadmap(k, { at = 0 } = {}) {
  const w = liveWall(state.wall), p = state.plan, steps = []
  const byId = xs => Object.fromEntries(xs.map(x => [x.id, x]))
  const jobs = byId(w.jobs), features = byId(w.features)
  steps.push({ title: 'your roadmap', text: [
    w.product?.name ? `${w.product.name}${p?.product.pitch ? `: ${p.product.pitch.replace(/\.$/, '')}` : ''}, for ${w.product.who}.` : '',
    'This is what you worked out today, one screen at a time.',
  ].filter(Boolean).join('\n\n') })
  if (w.problems.length) steps.push({ title: 'the problems your customer has', items: w.problems.map(x => ({ title: x.id, text: x.text, dot: 'var(--bad)' })) })
  if (w.workarounds.length) steps.push({ title: 'what they do about them today', items: w.workarounds.map(x => ({ title: `${x.id} · for ${x.problem}`, stamp: x.pays ? `pays ${x.pays}` : '', text: x.text, dot: 'var(--warn)' })) })
  if (w.jobs.length) steps.push({ title: 'the jobs they’re really trying to get done', items: w.jobs.map(x => ({ title: `When ${x.when}`, text: `I want ${x.want}, so ${x.so}.`, dot: 'var(--mine)' })) })
  if (w.features.length) steps.push({ title: 'what your product needs to do them', items: w.features.map(x => ({ title: `${x.id} · for ${x.job}`, text: x.name, dot: 'var(--live)' })) })
  const gz = argued()
  if (gz.job && (gz.kept.length || gz.later.length)) steps.push({ title: `argued down · what ground zero keeps for ${gz.job.id}`, items: [...gz.kept, ...gz.later].map(f => ({
    title: f.name, stamp: gz.reasons[f.id].keep ? 'stays in ground zero' : 'moves later', text: cap(gz.reasons[f.id].reason), dot: gz.reasons[f.id].keep ? 'var(--mine)' : 'var(--dim)',
  })) })
  if (p) {
    const stories = byId(p.stories)
    const shipped = r => [...new Set(r.stories.map(s => features[stories[s]?.feature]?.name).filter(Boolean))]
    steps.push({ title: 'your flight plan', items: p.releases.map(r => ({
      title: releaseName(r), stamp: monthName(r.month),
      text: `${r.completes.map(j => jobs[j]?.want).filter(Boolean).map(cap).join('. ')}.${r.price ? ` Billable: ${r.price}.` : ` ${shipped(r).length} feature${shipped(r).length > 1 ? 's' : ''}.`}`,
      dot: r.id === 'GZ' ? 'var(--mine)' : 'var(--dim)',
    })) })
    // each release: the features it ships, each with the stories that ship in it
    for (const r of p.releases) {
      const shipping = r.stories.map(id => stories[id]).filter(Boolean)
      steps.push({ title: `${releaseName(r).toLowerCase()} · ${monthName(r.month)}`, items: [...new Set(shipping.map(s => s.feature))].map(f => ({
        title: features[f]?.name || f, text: shipping.filter(s => s.feature === f).map(s => s.text.replace(/\.?$/, '.')).join(' '),
        dot: r.id === 'GZ' ? 'var(--mine)' : 'var(--dim)',
      })) })
    }
  }
  steps.push({ title: 'from here', text: [
    p ? `Ground Zero is the first thing to build: the smallest release that gets one job done for your customer, end to end.${p.releases[0]?.price ? ' And they already pay for a way round it.' : ''}` : 'Your flight plan, from Ground Zero, is being cut by your facilitator.',
    state.consent ? 'Your full report is coming by email: every story, and the flight plan, tidied by your facilitator.' : 'Your facilitator has all of this, and turns it into your full report.',
    p ? 'Press enter to open your roadmap as a website: all of it, on one page you can keep.' : '',
    'Another product, or another customer? Type /new to start a new conversation.',
  ].filter(Boolean).join('\n\n') })
  k.tour(steps, {
    title: 'your roadmap', at,
    end: p ? 'enter for your roadmap website' : 'enter to finish',
    // the last screen is the whole roadmap as one long page; leaving it comes back into the flow
    done: k => p ? openPage(() => showRoadmap(k, { at: -1 })) : k.note('said', 'enter to see it again · /new to start a new conversation'),
  })
}

/* ---------- the roadmap as one long page, over the kiosk ---------- */
const sheet = document.createElement('div')
sheet.className = 'roadmap'; sheet.hidden = true
sheet.innerHTML = '<iframe title="Your roadmap"></iframe><nav><button type="button">← back to the flow · esc</button><a target="_blank" rel="noopener">open as its own page ↗</a></nav>'
document.body.append(sheet)
const frame = sheet.querySelector('iframe')
let afterPage = null

function openPage(then) {
  const url = `/roadmap/${state.id}`
  if (frame.getAttribute('src') !== url) frame.src = url
  sheet.querySelector('a').href = url
  afterPage = then
  sheet.hidden = false
  requestAnimationFrame(() => requestAnimationFrame(() => { sheet.classList.add('open'); frame.contentWindow?.focus() }))
}

function closePage() {
  if (sheet.hidden || !sheet.classList.contains('open')) return
  sheet.classList.remove('open')
  setTimeout(() => { sheet.hidden = true }, 450)
  const then = afterPage; afterPage = null
  k.root.querySelector('textarea').focus({ preventScroll: true }) // keys belong to the kiosk again
  then?.()
}

sheet.querySelector('button').onclick = closePage
addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) { e.preventDefault(); e.stopImmediatePropagation(); closePage() } }, true)
// Escape inside the page (it's ours, same origin) comes back too
frame.addEventListener('load', () => {
  try {
    frame.contentWindow.addEventListener('keydown', e => { if (e.key === 'Escape') closePage() })
    // room above the roadmap's first line for the back button
    const room = frame.contentDocument.createElement('style')
    room.textContent = '.hero{padding-top:72px}'
    frame.contentDocument.head.append(room)
    frame.contentWindow.focus()
  } catch {}
})

/* ---------- starting again ---------- */
let restarting = false

/** /new: straight away once they're done; mid-way, one screen asks first. */
async function askNew(k) {
  if ((state?.contacted && state.done) || !(state?.chat.length > 1)) return startNew(k)
  if (me) return startNew(k).then(() => k.note('said', 'This one is kept in /conversations'))
  restarting = true
  await k.say('Start a new conversation? This one stays with your facilitator, but you can’t come back to it from here unless you /login first.', { status: 'start again · enter or yes · esc or no' })
}

async function keepThis(k) {
  restarting = false
  const last = exchanges().at(-1)
  await k.resume(last.echo, last.text)
  if (state.done && !state.contacted) beginContact()
}

async function startNew(k) {
  restarting = false
  try { state = await post('/api/session', { browser, fresh: true }) } catch (e) { return k.note('err', e.message) }
  remember()
  contact = null
  await k.reset()
}

/* ---------- the end: name, email and its code, consent, one screen each ---------- */
const CONSENT = 'May we email you your report, with your flight plan from Ground Zero, and three short follow-ups about it?'

/** Logged in, only what isn't known yet is asked: the name if the account has none, then the consent. */
function beginContact() {
  if (me?.name) { contact = { stage: 'consent', name: me.name, email: me.email }; return k.say(CONSENT, { status: 'your report · enter or yes · esc or no' }) }
  contact = { stage: 'name' }
  k.note('said', 'your name, for the report')
}

async function contactStep(text) {
  if (contact.stage === 'name') {
    if (!text) return k.note('said', 'your name, for the report')
    const first = text.split(/\s+/)[0]
    k.clear()
    if (me) {
      contact = { stage: 'consent', name: text.slice(0, 120), email: me.email }
      await k.say(`Thank you, ${first}. ${CONSENT}`, { echo: text, status: 'your report · enter or yes · esc or no' })
      return k.note()
    }
    contact = { stage: 'email', name: text.slice(0, 120) }
    await k.say(`Thank you, ${first}. Which email should your report go to? We’ll send a code to it, and that keeps all of this under your account.`, { echo: text, status: 'your report · 2 of 4' })
    return k.note()
  }
  if (contact.stage === 'email') {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(text)) return k.note('err', 'That doesn’t look like an email. Try it again.')
    try { await post('/api/login/start', { email: text }) } catch (e) { return k.note('err', e.message) }
    contact = { ...contact, stage: 'code', email: text }; k.clear()
    await k.say(`We’ve sent a code to ${text}. Type it here.`, { echo: text, status: 'your report · 3 of 4 · esc to change the email' })
    return k.note()
  }
  if (contact.stage === 'code') {
    try { me = (await post('/api/login/verify', { email: contact.email, code: text, id: state.id, name: contact.name })).me } catch (e) { return k.note('err', e.message) }
    contact = { ...contact, stage: 'consent' }; k.clear()
    await k.say(`That’s you, and your account is made: /conversations has this one from now on. ${CONSENT}`, { echo: text.replace(/\S/g, '•'), status: 'your report · 4 of 4 · enter or yes · esc or no' })
    return k.note()
  }
  const t = text.toLowerCase()
  if (t && !/^(y|n)/.test(t)) return k.note('err', 'Yes or no: enter for yes, escape for no.')
  return finish(!t || t.startsWith('y'))
}

async function finish(consent) {
  const { name, email } = contact, first = name.split(/\s+/)[0]
  contact = null
  await k.flight(consent ? 'yes' : 'no', async out => {
    try { state = await post('/api/contact', { id: state.id, name, consent }) }
    catch (e) { contact = { stage: 'consent', name, email }; throw e }
    me = state.me ?? me
    out.write([
      consent ? `Thank you, ${first}. Your report is on its way to ${email}.` : `Thank you, ${first}. We won’t email you, and what you worked out is saved with your facilitator.`,
      state.plan ? 'Before you go, here is your roadmap, and your flight plan from Ground Zero. Press enter to walk through it.' : 'Before you go, here is your roadmap. Press enter to walk through it.',
    ].join('\n\n'))
  })
}

/* ---------- the kiosk ---------- */
const k = mount({
  invite: 'What are you building, and who is it for?',
  hint: 'roadmap-first coach · one question at a time · the answers are yours',
  ask, status, history: exchanges,
  statusAction: () => state?.contacted && state.done ? () => showRoadmap(k) : hasWall() ? () => openWall(k) : null,
  commands: [
    { name: '/wall', hint: 'what you’ve said so far, step by step · t to trash', run: k => openWall(k), when: hasWall },
    { name: '/trash', hint: 'what you set aside: bring it back', run: k => openTrash(k), when: () => hasTrash() || !!me },
    { name: '/conversations', hint: 'every conversation under your account', run: k => openConversations(k), when: () => !!me },
    // offered only once there's a report to show: the four steps done, the email left, the flight plan cut
    { name: '/roadmap', hint: 'your roadmap report, with the flight plan', run: () => openPage(null), when: () => !!(state?.contacted && state.plan) },
    { name: '/new', hint: 'start a new conversation', run: askNew, when: () => state?.chat.length > 1 },
    { name: '/login', hint: 'your conversations, on any browser: we email you a code', run: startLogin, when: () => !me },
    { name: '/logout', hint: () => `logged in as ${me?.email}`, run: logout, when: () => !!me },
  ].map(c => typeof c.hint === 'function' ? Object.defineProperty(c, 'hint', { get: c.hint }) : c),
  intercept: async text => {
    if (login) { if (text) await loginStep(k, text); return true }
    if (restarting) {
      const t = text.toLowerCase()
      if (t && !/^(y|n)/.test(t)) { k.note('err', 'Yes or no: enter for yes, escape for no.'); return true }
      k.clear()
      await (!t || t.startsWith('y') ? startNew(k) : keepThis(k))
      return true
    }
    if (contact) { await contactStep(text); return true }
    if (state?.contacted && state.done) { if (text) k.note('said', 'You’re done with this one. Press enter to see your roadmap again, or type /new to start a new conversation.'); else showRoadmap(k); return true }
    if (state?.done && text) { beginContact(); await contactStep(text); return true }
    return false
  },
  escape: () => {
    if (login) {
      if (login.stage === 'code') { login = { stage: 'email' }; k.say('Which email are you? We’ll send a code to it.', { status: 'log in · 1 of 2 · esc to cancel' }); return true }
      login = null; resumeHere(k); return true
    }
    if (restarting) { keepThis(k); return true }
    if (contact?.stage === 'code') { contact = { stage: 'email', name: contact.name }; k.say('Which email should your report go to?', { status: 'your report · 2 of 4' }); return true }
    if (contact?.stage === 'consent') { finish(false); return true } return false },
  after: () => { if (state.done && !state.contacted && !contact) beginContact() },
  onError: e => { if ((e.code === 'contact' || e.code === 'login') && !contact) beginContact() },
})

let id = null
try { id = localStorage.getItem('coach-session') } catch {}
try {
  state = await post('/api/session', { id, browser })
  me = state.me
  remember()
  if (state.chat.length > 1 || (state.contacted && state.done)) await resumeHere(k)
  else { k.invite(); if (state.done && !state.contacted) beginContact() }
} catch (e) {
  k.note('err', e.message || 'The coach can’t be reached. Reload to try again.')
}
</script>
